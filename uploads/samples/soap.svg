<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Olive and laurel soap bars">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0e4"/>
      <stop offset="0.6" stop-color="#e4e6d5"/>
      <stop offset="1" stop-color="#d6d8c3"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3ae8a"/>
      <stop offset="0.45" stop-color="#8b9a72"/>
      <stop offset="1" stop-color="#6e7c58"/>
    </linearGradient>
    <linearGradient id="creamBar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5edd9"/>
      <stop offset="1" stop-color="#ddd0b4"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6f7259" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6f7259" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <path d="M270 1290V700a330 330 0 0 1 660 0v590z" fill="#f2f3e8" opacity="0.55"/>
  <rect y="1258" width="1200" height="242" fill="#cbcbb4"/>
  <ellipse cx="600" cy="1268" rx="350" ry="56" fill="url(#shadow)"/>

  <g transform="rotate(-7 600 900)">
    <rect x="352" y="742" width="500" height="470" rx="54" fill="url(#creamBar)"/>
    <rect x="352" y="742" width="500" height="470" rx="54" fill="none" stroke="#c2b493" stroke-opacity="0.6" stroke-width="3"/>
    <circle cx="602" cy="930" r="86" fill="none" stroke="#b7a887" stroke-opacity="0.55" stroke-width="2.5"/>
    <text x="602" y="922" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6" fill="#8b7a5b">OLIVE</text>
    <text x="602" y="960" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="6" fill="#8b7a5b">LAUREL</text>
  </g>

  <g>
    <rect x="300" y="840" width="560" height="420" rx="60" fill="url(#sage)"/>
    <rect x="300" y="840" width="560" height="420" rx="60" fill="none" stroke="#5c6a48" stroke-opacity="0.45" stroke-width="3"/>
    <ellipse cx="580" cy="860" rx="250" ry="26" fill="#b7c19c" opacity="0.55"/>
    <circle cx="580" cy="1050" r="96" fill="none" stroke="#e9ecd9" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="580" cy="1050" r="76" fill="none" stroke="#e9ecd9" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="580" y="1042" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="5" fill="#eef1de">ATELIER</text>
    <text x="580" y="1078" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#eef1de">NOUR</text>
    <path d="M330 900c40 10 60 30 66 66" stroke="#d7ddc0" stroke-opacity="0.5" stroke-width="10" fill="none" stroke-linecap="round"/>
    <g transform="translate(680 1130)" fill="none" stroke="#e7ebd6" stroke-opacity="0.8" stroke-width="3">
      <path d="M0 0c40-46 96-52 132-30"/>
      <path d="M22-14c-6-24 2-40 18-50 4 18 0 34-18 50z" fill="#e7ebd6" fill-opacity="0.35"/>
      <path d="M64-28c-2-26 8-40 26-48 2 18-4 34-26 48z" fill="#e7ebd6" fill-opacity="0.35"/>
      <path d="M102-34c0-22 10-34 26-40 0 16-6 30-26 40z" fill="#e7ebd6" fill-opacity="0.35"/>
    </g>
  </g>

  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.5"/>
</svg>
