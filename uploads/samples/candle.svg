<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Amber and cedar candle in a glass jar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ecdc"/>
      <stop offset="0.55" stop-color="#eddfc8"/>
      <stop offset="1" stop-color="#e2cfb2"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f4a24"/>
      <stop offset="0.18" stop-color="#c0763f"/>
      <stop offset="0.5" stop-color="#a95f30"/>
      <stop offset="0.82" stop-color="#7d3d1c"/>
      <stop offset="1" stop-color="#5f2c13"/>
    </linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efdcc0"/>
      <stop offset="1" stop-color="#d9bd97"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd79a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd79a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <path d="M250 1290V720a350 350 0 0 1 700 0v570z" fill="#f1e5d2" opacity="0.65"/>
  <rect y="1258" width="1200" height="242" fill="#dbc7a8"/>
  <ellipse cx="600" cy="1265" rx="330" ry="42" fill="#b89a76" opacity="0.45" filter="url(#soft)"/>

  <ellipse cx="600" cy="800" rx="260" ry="120" fill="url(#glow)"/>

  <g>
    <rect x="425" y="780" width="350" height="470" rx="46" fill="url(#jar)"/>
    <rect x="425" y="780" width="350" height="470" rx="46" fill="none" stroke="#6b3216" stroke-opacity="0.35" stroke-width="3"/>
    <ellipse cx="600" cy="782" rx="175" ry="34" fill="#e9d5b6"/>
    <ellipse cx="600" cy="786" rx="150" ry="26" fill="url(#wax)"/>
    <line x1="600" y1="786" x2="600" y2="742" stroke="#3a2a1c" stroke-width="7" stroke-linecap="round"/>
    <path d="M600 745c26-24 26-52 0-78-26 26-26 54 0 78z" fill="#f0a53c"/>
    <path d="M600 738c13-13 13-30 0-46-13 16-13 33 0 46z" fill="#fff1c9"/>
    <rect x="512" y="972" width="176" height="176" rx="6" fill="#f7edda"/>
    <text x="600" y="1038" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="5" fill="#4a3323">ATELIER</text>
    <text x="600" y="1078" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="5" fill="#4a3323">NOUR</text>
    <line x1="546" y1="1102" x2="654" y2="1102" stroke="#b9a486" stroke-width="1.5"/>
    <text x="600" y="1134" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#7c6650">AMBER &amp; CEDAR</text>
    <path d="M455 900c14 90 16 200 8 300" stroke="#f0b184" stroke-opacity="0.45" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M742 860c-10 100-10 220 2 330" stroke="#4a2110" stroke-opacity="0.35" stroke-width="18" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.55"/>
</svg>
