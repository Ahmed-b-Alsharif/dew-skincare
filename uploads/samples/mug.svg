<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Sand-speckled stoneware mug">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f4efe4"/>
      <stop offset="0.6" stop-color="#e9e0cf"/>
      <stop offset="1" stop-color="#dcd0bb"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfc3ab"/>
